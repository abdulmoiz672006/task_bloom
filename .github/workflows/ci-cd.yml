name: TaskBloom CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: moiz672006/taskbloom-backend
  FRONTEND_IMAGE: moiz672006/taskbloom-frontend

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Images
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:latest ./backend
          docker build -t ${{ env.FRONTEND_IMAGE }}:latest ./frontend
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/task_bloom
            git pull origin main

            docker pull moiz672006/taskbloom-backend:latest
            docker pull moiz672006/taskbloom-frontend:latest

            helm upgrade --install taskbloom ./helm/taskbloom -n taskbloom
            kubectl delete -A ValidatingWebhookConfiguration ingress-nginx-admission || true

            kubectl set env deployment/monitoring-grafana -n monitoring \
              GF_SERVER_ROOT_URL=http://${{ secrets.EC2_HOST }}/grafana/ \
              GF_SERVER_SERVE_FROM_SUB_PATH=true

            kubectl apply -f - <<YAML
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: taskbloom-backend
              namespace: monitoring
              labels:
                release: monitoring
            spec:
              namespaceSelector:
                matchNames:
                  - taskbloom
              selector:
                matchLabels:
                  app: backend
              endpoints:
                - path: /metrics
                  targetPort: 5000
                  interval: 15s
            YAML

            echo "Deploy complete: http://${{ secrets.EC2_HOST }}/"
