apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskbloom.fullname" . }}
  labels:
    {{- include "taskbloom.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskbloom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskbloom.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "taskbloom.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
