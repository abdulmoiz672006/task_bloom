backend:
  replicaCount: 2

  image:
    repository: moiz672006/taskbloom-backend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 5000

frontend:
  replicaCount: 2

  image:
    repository: moiz672006/taskbloom-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    port: 3000

ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2

  hosts:
    - host: ""
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          serviceName: backend-service
          servicePort: 5000

        - path: /grafana(/|$)(.*)
          pathType: ImplementationSpecific
          serviceName: monitoring-grafana
          servicePort: 80

        - path: /()(.*)
          pathType: ImplementationSpecific
          serviceName: frontend-service
          servicePort: 3000

